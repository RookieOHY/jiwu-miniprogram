<svg xmlns="http://www.w3.org/2000/svg" width="240" height="170" viewBox="0 0 240 170">
  <defs>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 耳朵 -->
  <polygon points="62,52 40,-6 122,26" fill="#FFFFFF" stroke="#B794F6" stroke-width="7"/>
  <polygon points="178,52 200,-6 118,26" fill="#FFFFFF" stroke="#B794F6" stroke-width="7"/>
  <polygon points="74,40 62,8 108,28" fill="#D8BDFB"/>
  <polygon points="166,40 178,8 132,28" fill="#D8BDFB"/>

  <!-- 头下的柔和紫影，增强"趴着"的体积感 -->
  <ellipse cx="120" cy="140" rx="85" ry="18" fill="#8B5CF6" opacity="0.25" filter="url(#sh)"/>

  <!-- 脑袋 -->
  <ellipse cx="120" cy="78" rx="66" ry="58" fill="#FFFFFF" stroke="#B794F6" stroke-width="7" filter="url(#sh)"/>

  <!-- 眯眯眼 + ω嘴 + 腮红 -->
  <path d="M74 66 Q84 79 94 66" fill="none" stroke="#4A4238" stroke-width="7" stroke-linecap="round"/>
  <path d="M146 66 Q156 79 166 66" fill="none" stroke="#4A4238" stroke-width="7" stroke-linecap="round"/>
  <path d="M112 94 Q116 101 120 96 Q124 101 128 94" fill="none" stroke="#4A4238" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="62" cy="88" rx="13" ry="8" fill="#E3A8F5" opacity="0.9"/>
  <ellipse cx="178" cy="88" rx="13" ry="8" fill="#E3A8F5" opacity="0.9"/>

  <!-- 扒边的两只前爪 -->
  <ellipse cx="76" cy="152" rx="22" ry="16" fill="#FFFFFF" stroke="#B794F6" stroke-width="7"/>
  <ellipse cx="164" cy="152" rx="22" ry="16" fill="#FFFFFF" stroke="#B794F6" stroke-width="7"/>
  <path d="M69 146 v12 M83 146 v12" stroke="#B794F6" stroke-width="5" stroke-linecap="round"/>
  <path d="M157 146 v12 M171 146 v12" stroke="#B794F6" stroke-width="5" stroke-linecap="round"/>
</svg>
